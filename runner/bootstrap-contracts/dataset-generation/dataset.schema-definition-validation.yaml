version: 1
cases:
- id: missing-type-enum-or-const
  input:
    schema:
      title: invalid
  expected:
    error_contains: requires type, enum, or const
  coverage_fingerprint: 5ba49363f9ee8514abd8ff616391fb62
- id: unsupported-schema-keyword
  input:
    schema:
      type: string
      pattern: ^[a-z]+$
  expected:
    error_contains: pattern is not supported
  coverage_fingerprint: 76cbd44f797b1fa7e09f48b084d240dc
- id: empty-enum
  input:
    schema:
      enum: []
  expected:
    error_contains: enum must not be empty
  coverage_fingerprint: 7a86ba5b8dc93277a967bae307f6e0f6
- id: unsupported-type
