        \ == \"case-missing\": path.write_text(\"version: 1\\ncases: []\\n\")\nelif\
        \ mutation == \"step-missing\": path.write_text(\"version: 1\\ncases:\\n-\
        \ id: one\\n  steps: []\\n\")\nelif mutation == \"readonly\": path.chmod(0o444)\n\
        elif mutation == \"tagged-json\": path.write_text(\"version: 1\\ncases:\\\
        n- id: one\\n  input: {value: 7}\\n  expected: {value: 7}\\n  coverage_fingerprint:\
        \ 11111111111111111111111111111111\\n  extra: !fixture thing\\n\")\nprint(json.dumps({\"\
