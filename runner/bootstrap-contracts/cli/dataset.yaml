      contract.yaml: "version: \"1\"\nname: cli-smoke-fixture\ncoverage:\n  minimum_line_percent: 0\nfiles:\n  dataset: dataset.json\n  validator: validator.py\n  supplemental_tests: [tests/check.py]\nfilesystem:\n  read: [dataset.json, validator.py, adapter.py, tests/check.py]\n  write: []\nexecution:\n  command: [python3, adapter.py]\n"
      dataset.json: '{"version":1,"cases":[{"id":"echo","input":{"value":7},"expected":{"value":7},"coverage_fingerprint":"60c6194cbdc58033999a1fb07d147da8"},{"id":"echo-text","input":{"value":"text"},"expected":{"value":"text"},"coverage_fingerprint":"60c6194cbdc58033999a1fb07d147da8"},{"id":"sequence","steps":[{"id":"first","input":{"value":1},"expected":{"value":1},"coverage_fingerprint":"60c6194cbdc58033999a1fb07d147da8"},{"id":"second","input":{"value":2},"expected":{"value":2},"coverage_fingerprint":"60c6194cbdc58033999a1fb07d147da8"}]}]}'
