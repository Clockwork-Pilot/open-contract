- id: runs-the-complete-contract-input
  setup: true
  input:
    args:
    - run-manifest
    - contract.yaml
    - --isolation
    - none
    - --coverage-report
    - coverage.json
    - --update-fingerprints
    files:
      contract.yaml: "version: '1'\nname: cli-smoke-fixture\ncoverage:\n  minimum_line_percent:\
        \ 0\nfilesystem:\n  read:\n  - dataset.yaml\n  - validator.py\n  - adapter.py\n\
        \  - tests/check.py\n  write: []\nexecution:\n  command:\n  - python3\n  -\
        \ adapter.py\ndatasets:\n- dataset.yaml\ncoverage_sources:\n- validator.py\n\
        supplemental_tests:\n- tests/check.py\n"
      validator.py: "def validate(value):\n    return value\n"
      adapter.py: "import json\nimport sys\nrequest = json.load(sys.stdin)\nresults\
        \ = []\nscopes = []\nfor item in request[\"requests\"]:\n    results.append({\"\
        key\": item[\"key\"], \"output\": item[\"input\"]})\n    scopes.append({\"\
        key\": item[\"key\"], \"files\": [{\"path\": \"validator.py\", \"lines\":\
        \ [1]}]})\nprint(json.dumps({\n    \"results\": results,\n    \"coverage\"\
        : {\"sources\": [\"validator.py\"]},\n    \"coverage_scopes\": scopes,\n \
        \   \"coverage_lines\": [{\"path\": \"validator.py\", \"executable_lines\"\
        : [1], \"covered_lines\": [1]}],\n    \"additional_test_coverage\": {\"executed\"\
        : True, \"passed\": True, \"native_report\": {\"format\": \"fixture\"}},\n\
        \    \"additional_coverage_lines\": [{\"path\": \"validator.py\", \"executable_lines\"\
        : [1], \"covered_lines\": [1]}]\n}))\n"
      tests/check.py: "def run():\n    return True\n"
      dataset.yaml: "version: 1\ncases:\n- id: echo\n  input:\n    value: 7\n  expected:\n\
        \    value: 7\n  coverage_fingerprint: '11111111111111111111111111111111'\n\
        - id: echo-text\n  input:\n    value: text\n  expected:\n    value: text\n\
        \  coverage_fingerprint: 867714e81b27e269f9a7f3b13bdc37ae\n- id: sequence\n\
        \  steps:\n  - id: first\n    input:\n      value: 1\n    expected:\n    \
        \  value: 1\n    coverage_fingerprint: '22222222222222222222222222222222'\n\
        \  - id: second\n    input:\n      value: 2\n    expected:\n      value: 2\n\
        \    coverage_fingerprint: 867714e81b27e269f9a7f3b13bdc37ae\n"
    dataset_path: dataset.yaml
  expected:
    exit_code: 0
    stdout: "Isolation mode: none\nUpdated cli-smoke-fixture/echo fingerprint: 11111111111111111111111111111111 -> 867714e81b27e269f9a7f3b13bdc37ae\n  covered: validator.py:1\nUpdated cli-smoke-fixture/sequence/first fingerprint: 22222222222222222222222222222222 -> 867714e81b27e269f9a7f3b13bdc37ae\n  covered: validator.py:1\nUpdated 2 fingerprint(s) in dataset.yaml\nContracts executed:\n  cli-smoke-fixture: 3/3 cases passed\nDataset cases: 3/3 passed across 1 contract(s)\nCoverage report: coverage.json\n"
