- id: runs-the-complete-contract-input
  setup: true
  input:
    args: ["run-manifest", "contract.yaml", "--isolation", "none", "--coverage-report", "coverage.json"]
    files:
      contract.yaml: |
        version: "1"
        name: cli-smoke-fixture
        coverage:
          minimum_line_percent: 0
        files:
          dataset: dataset.json
          validator: validator.py
          supplemental_tests: [tests/check.py]
        filesystem:
          read: [dataset.json, validator.py, adapter.py, tests/check.py]
          write: []
        execution:
          command: [python3, adapter.py]
      dataset.json: '{"version":1,"cases":[{"id":"echo","input":{"value":7},"expected":{"value":7},"coverage_fingerprint":"60c6194cbdc58033999a1fb07d147da8"},{"id":"echo-text","input":{"value":"text"},"expected":{"value":"text"},"coverage_fingerprint":"60c6194cbdc58033999a1fb07d147da8"},{"id":"sequence","input":{"value":"sequence"},"steps":[{"id":"first","input":{"value":1},"expected":{"value":1},"coverage_fingerprint":"60c6194cbdc58033999a1fb07d147da8"},{"id":"second","input":{"value":2},"expected":{"value":2},"coverage_fingerprint":"60c6194cbdc58033999a1fb07d147da8"}],"coverage_fingerprint":"60c6194cbdc58033999a1fb07d147da8"}]}'
      validator.py: |
        def validate(value):
            return value
      adapter.py: |
        import json
        import sys
        request = json.load(sys.stdin)
        results = []
        scopes = []
        for item in request["requests"]:
            results.append({"key": item["key"], "output": item["input"]})
            scopes.append({"key": item["key"], "files": [{"path": "validator.py", "lines": [1]}]})
        print(json.dumps({
            "results": results,
            "coverage": {"sources": ["validator.py"]},
            "coverage_scopes": scopes,
            "coverage_lines": [{"path": "validator.py", "executable_lines": [1], "covered_lines": [1]}],
            "additional_test_coverage": {"executed": True, "passed": True, "native_report": {"format": "fixture"}},
            "additional_coverage_lines": [{"path": "validator.py", "executable_lines": [1], "covered_lines": [1]}]
        }))
      tests/check.py: |
        def run():
            return True
  expected:
    exit_code: 0
    stdout: |
      Dataset cases: 3/3 passed across 1 contract(s)
      Coverage report: coverage.json
    coverage_report:
      contracts:
      - contract: cli-smoke-fixture
        report:
          sources: [validator.py]
    stderr: ''
  coverage_fingerprint: 'f64862affe70cc84e2635bfedcdf85cd'
