        - id: first
          input:
            value: 1
          expected:
            value: 1
          coverage_fingerprint: 867714e81b27e269f9a7f3b13bdc37ae
        - id: second
          input:
            value: 2
          expected:
            value: 2
          coverage_fingerprint: 867714e81b27e269f9a7f3b13bdc37ae
  coverage_fingerprint: 193756e6a759d30cc500a5e4bc3fc467
