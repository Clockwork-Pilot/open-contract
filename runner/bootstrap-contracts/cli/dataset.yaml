- id: lists-contracts-executed-through-recursive-nesting
  setup: true
  input:
    args:
    - run-manifest
    - contract.yaml
    - --isolation
    - none
    - --coverage-report
    - coverage.json
    - --disable-fingerprints
    files:
      contract.yaml: |
        version: '1'
        name: nested-root
        datasets: [dataset.yaml]
        coverage: {minimum_line_percent: 0}
        coverage_sources: [validator.py]
        nested_contracts: [child/contract.yaml]
        filesystem:
          read: [dataset.yaml, validator.py, adapter.py, child/contract.yaml]
          write: []
        execution: {command: [python3, adapter.py]}
      child/contract.yaml: |
        version: '1'
        name: nested-child
        datasets: [dataset.yaml]
        coverage: {minimum_line_percent: 0}
        coverage_sources: [validator.py]
        nested_contracts: [grandchild/contract.yaml]
        filesystem:
          read: [dataset.yaml, validator.py, adapter.py, grandchild/contract.yaml]
          write: []
        execution: {command: [python3, adapter.py]}
      child/grandchild/contract.yaml: |
        version: '1'
        name: nested-grandchild
        datasets: [dataset.yaml]
        coverage: {minimum_line_percent: 0}
        coverage_sources: [validator.py]
        filesystem:
          read: [dataset.yaml, validator.py, adapter.py]
          write: []
        execution: {command: [python3, adapter.py]}
      dataset.yaml: |
        version: 1
        cases:
        - id: echo
          input: {value: 1}
          expected: {value: 1}
          coverage_fingerprint: 60c6194cbdc58033999a1fb07d147da8
      child/dataset.yaml: |
        version: 1
        cases:
        - id: echo
          input: {value: 2}
          expected: {value: 2}
          coverage_fingerprint: 60c6194cbdc58033999a1fb07d147da8
      child/grandchild/dataset.yaml: |
        version: 1
        cases:
        - id: echo
          input: {value: 3}
          expected: {value: 3}
          coverage_fingerprint: 60c6194cbdc58033999a1fb07d147da8
      validator.py: |
        def validate(value):
            return value
      child/validator.py: |
        def validate(value):
            return value
      child/grandchild/validator.py: |
        def validate(value):
            return value
      adapter.py: |
        import json, sys
        request = json.load(sys.stdin)
        results = []
        scopes = []
        for item in request["requests"]:
            results.append({"key": item["key"], "output": item["input"]})
            scopes.append({"key": item["key"], "files": [{"path": "validator.py", "lines": [1]}]})
        print(json.dumps({
            "results": results,
            "coverage": {"sources": ["validator.py"]},
            "coverage_scopes": scopes,
            "coverage_lines": [{"path": "validator.py", "executable_lines": [1], "covered_lines": [1]}]
        }))
      child/adapter.py: |
        import json, sys
        request = json.load(sys.stdin)
        results = []
        scopes = []
        for item in request["requests"]:
            results.append({"key": item["key"], "output": item["input"]})
            scopes.append({"key": item["key"], "files": [{"path": "validator.py", "lines": [1]}]})
        print(json.dumps({
            "results": results,
            "coverage": {"sources": ["validator.py"]},
            "coverage_scopes": scopes,
            "coverage_lines": [{"path": "validator.py", "executable_lines": [1], "covered_lines": [1]}]
        }))
      child/grandchild/adapter.py: |
        import json, sys
        request = json.load(sys.stdin)
        results = []
        scopes = []
        for item in request["requests"]:
            results.append({"key": item["key"], "output": item["input"]})
            scopes.append({"key": item["key"], "files": [{"path": "validator.py", "lines": [1]}]})
        print(json.dumps({
            "results": results,
            "coverage": {"sources": ["validator.py"]},
            "coverage_scopes": scopes,
            "coverage_lines": [{"path": "validator.py", "executable_lines": [1], "covered_lines": [1]}]
        }))
  expected:
    exit_code: 0
    stdout: |
      Isolation mode: none
      Coverage fingerprints: disabled
      Contracts executed:
        nested-root: 1/1 cases passed
        nested-child: 1/1 cases passed
        nested-grandchild: 1/1 cases passed
      Dataset cases: 3/3 passed across 3 contract(s)
      Coverage report: coverage.json
    stderr: ''
    coverage_report:
      version: 1
      contracts:
      - contract: nested-root
        status: passed
      - contract: nested-child
        status: passed
      - contract: nested-grandchild
        status: passed
