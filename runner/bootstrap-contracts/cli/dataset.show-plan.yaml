- id: show-plan-prints-a-valid-plan
  setup: show-plan-prints-a-valid-plan
  input:
    args:
    - show-isolation-plan
    - contract.yaml
    - --isolation
    - none
    files:
      contract.yaml: "version: '1'\nname: cli-show-plan-fixture\nminimum_coverage_percent:\
        \ 0\nfilesystem:\n  read:\n  - dataset.json\n  - validator.py\n  - adapter.py\n\
        \  write: []\nexecution:\n  command:\n  - python3\n  - adapter.py\ndatasets:\n\
        - dataset.json\ncoverage_sources:\n- validator.py\n"
      dataset.json: '{"version":1,"cases":[{"id":"one","input":{"value":1},"expected":{"value":1},"coverage_fingerprint":"11111111111111111111111111111111"}]}'
      validator.py: "def validate(value):\n    return value\n"
      adapter.py: 'import json

        import sys

        request = json.load(sys.stdin)

        print(json.dumps({"results": []}))

        '
  predicate: .exit_code == 0 AND .stderr == "" AND .stdout != ""
  expected: {}
  coverage_fingerprint: cb5d5bfedd386fb737f054f71f0719b5
- id: show-plan-prints-partial-plan-before-staging-warning
