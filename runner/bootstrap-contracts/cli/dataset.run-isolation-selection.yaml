version: 1
cases:
- id: run-manifest-defaults-to-auto-isolation
  setup: run-manifest-defaults-to-auto-isolation
  input:
    args:
    - run-manifest
    - open-contract.yaml
    environment: {}
    files:
      bin/bwrap: '#!/bin/sh

        exit 0

        '
  expected:
    exit_code: 2
    stderr: 'contract-runner: contract execution: No such file or directory (os error
      2)

      '
  predicate: 'contains(.stdout, ''Isolation auto selected: bwrap'')'
  coverage_fingerprint: 64039218e71eea5e1ea0b7d64368ba99
- id: run-manifest-explicitly-selects-landlock
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - landlock
  expected:
    exit_code: 2
    stdout: 'Isolation mode: landlock

      '
    stderr: 'contract-runner: contract execution: No such file or directory (os error
      2)

      '
  coverage_fingerprint: a0ec41bebb88aa6f4cee511a2aef0148
