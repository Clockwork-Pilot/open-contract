- id: run-manifest-skips-nested-contracts
  setup: run-manifest-skips-nested-contracts
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - none
    - --coverage-report
    - coverage.json
    - --disable-fingerprints
    - --no-nested-contracts
    environment:
      OPEN_CONTRACT_DISABLE_FINGERPRINTS: '1'
    files:
      open-contract.yaml: "version: '1'\nname: cli-root-only\nminimum_coverage_percent:\
        \ 0\nfilesystem:\n  read: [dataset.json, validator.py, adapter.py, child/open-contract.yaml]\n\
        \  write: []\nexecution: {command: [python3, adapter.py]}\ndatasets: [dataset.json]\n\
        coverage_sources: [validator.py]\nnested_contracts: [child/open-contract.yaml]\n"
      dataset.json: '{"version":1,"cases":[{"id":"root","input":{"value":1},"expected":{"value":1},"coverage_fingerprint":"867714e81b27e269f9a7f3b13bdc37ae"}]}'
      validator.py: "def validate(value):\n    return value\n"
      adapter.py: "import json, sys\nrequest = json.load(sys.stdin)\nresults = []\n\
        scopes = []\nfor item in request[\"requests\"]:\n    results.append({\"key\"\
        : item[\"key\"], \"output\": item[\"input\"]})\n    scopes.append({\"key\"\
        : item[\"key\"], \"files\": [{\"path\": \"validator.py\", \"lines\": [1]}]})\n\
        print(json.dumps({\"results\": results, \"coverage\": {\"sources\": [\"validator.py\"\
        ]}, \"coverage_scopes\": scopes, \"coverage_lines\": [{\"path\": \"validator.py\"\
        , \"executable_lines\": [1], \"covered_lines\": [1]}]}))\n"
      child/open-contract.yaml: 'version: ''1''

        name: cli-child

        minimum_coverage_percent: 0

        filesystem: {read: [dataset.json, validator.py, adapter.py], write: []}

        execution: {command: [python3, adapter.py]}

        datasets: [dataset.json]

        coverage_sources: [validator.py]

        '
      child/dataset.json: '{"version":1,"cases":[{"id":"child","input":{"value":2},"expected":{"value":2},"coverage_fingerprint":"867714e81b27e269f9a7f3b13bdc37ae"}]}'
      child/validator.py: "def validate(value):\n    return value\n"
      child/adapter.py: "import json, sys\nrequest = json.load(sys.stdin)\nresults\
        \ = []\nscopes = []\nfor item in request[\"requests\"]:\n    results.append({\"\
        key\": item[\"key\"], \"output\": item[\"input\"]})\n    scopes.append({\"\
        key\": item[\"key\"], \"files\": [{\"path\": \"validator.py\", \"lines\":\
        \ [1]}]})\nprint(json.dumps({\"results\": results, \"coverage\": {\"sources\"\
        : [\"validator.py\"]}, \"coverage_scopes\": scopes, \"coverage_lines\": [{\"\
        path\": \"validator.py\", \"executable_lines\": [1], \"covered_lines\": [1]}]}))\n"
  expected:
    exit_code: 0
    stdout: "Isolation mode: none\nCoverage fingerprints: disabled\nContracts executed:\n\
      \  cli-root-only: 1/1 cases passed\nDataset cases: 1/1 passed across 1 contract(s)\n\
      Coverage report: coverage.json\n"
    stderr: ''
    coverage_report:
      version: 1
      contracts:
      - contract: cli-root-only
        status: passed
  coverage_fingerprint: 40944d398f198d422f64a345ee091c6a
