version: 1
cases:
- id: reports-incomplete-contract-coverage
  setup: reports-incomplete-contract-coverage
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - none
    - --coverage-report
    - coverage.json
    environment:
      OPEN_CONTRACT_DISABLE_FINGERPRINTS: '1'
    files:
      open-contract.yaml: "version: '1'\nname: cli-incomplete-coverage-fixture\nminimum_coverage_percent:\
        \ 0\nfilesystem:\n  read:\n  - dataset.json\n  - validator.py\n  - adapter.py\n\
        \  write: []\nexecution:\n  command:\n  - python3\n  - adapter.py\ndatasets:\n\
        - dataset.json\ncoverage_sources:\n- validator.py\n"
      dataset.json: '{"version":1,"cases":[{"id":"without-coverage","input":{"value":8},"expected":{"value":8},"coverage_fingerprint":"867714e81b27e269f9a7f3b13bdc37ae"}]}'
      validator.py: "def validate(value):\n    return value\n"
      adapter.py: "import json\nimport sys\nrequest = json.load(sys.stdin)\nresults\
        \ = []\nscopes = []\nfor item in request[\"requests\"]:\n    results.append({\"\
        key\": item[\"key\"], \"output\": item[\"input\"]})\n    scopes.append({\"\
        key\": item[\"key\"], \"files\": [{\"path\": \"validator.py\", \"lines\":\
        \ [1]}]})\nprint(json.dumps({\n    \"results\": results,\n    \"coverage\"\
        : {\"sources\": []},\n    \"coverage_scopes\": scopes,\n    \"coverage_lines\"\
        : [{\"path\": \"validator.py\", \"executable_lines\": [1], \"covered_lines\"\
        : [1]}],\n}))\n"
  expected:
    exit_code: 1
    coverage_report:
      version: 1
      contracts:
      - contract: cli-incomplete-coverage-fixture
        status: failed
        sources:
          status: missing
          declared:
          - validator.py
          covered: []
          missing:
          - validator.py
    stdout: "Isolation mode: none\nCoverage fingerprints: disabled\nContracts executed:\n\
      \  cli-incomplete-coverage-fixture: 1/1 cases passed\nDataset cases: 1/1 passed\
      \ across 1 contract(s)\nCoverage report: coverage.json\n"
    stderr: 'contract-runner: coverage requirements not met; see adapter coverage
      report

      '
  coverage_fingerprint: fdf6b8b7d50cf42f2221ada4bb97416c
