version: 1
cases:
- id: empty-arguments-show-usage
  input:
    args: []
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: usage: contract-runner <run-manifest|show-isolation-plan>
      <manifest-path> [--isolation <auto|tempdir|none|bwrap|landlock>] [--isolation-runtime
      <path>] [--coverage-report <path>] [--coverage-html <directory>] [--disable-fingerprints|--update-fingerprints]
      [--no-nested-contracts]

      '
  coverage_fingerprint: 4b1c8ee95eef68aa5b067c710ea6f5af
- id: unknown-subcommand-is-rejected
  input:
    args:
    - execute
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: usage: contract-runner <run-manifest|show-isolation-plan>
      <manifest-path> [--isolation <auto|tempdir|none|bwrap|landlock>] [--isolation-runtime
      <path>] [--coverage-report <path>] [--coverage-html <directory>] [--disable-fingerprints|--update-fingerprints]
      [--no-nested-contracts]

      '
  coverage_fingerprint: 4b1c8ee95eef68aa5b067c710ea6f5af
- id: rejects-unknown-option
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - none
    - --unknown
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: unknown argument: --unknown

      '
  coverage_fingerprint: 58b326ca788da390c53e391669e5502f
- id: rejects-invalid-isolation-backend
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - invalid
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: invalid isolation backend "invalid"; expected auto,
      tempdir, none, bwrap, or landlock

      '
  coverage_fingerprint: 3dc08c6f9045c909d083aec9aab8764d
- id: rejects-runtime-with-no-isolation
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - none
    - --isolation-runtime
    - runtime.yaml
  expected:
    exit_code: 2
    stdout: 'Isolation mode: none

      '
    stderr: 'contract-runner: --isolation-runtime cannot be used with --isolation
      none

      '
  coverage_fingerprint: 353c2b4bc1d52130e2eec1b64fd1bf5e
- id: rejects-runtime-with-tempdir
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - tempdir
    - --isolation-runtime
    - runtime.yaml
  expected:
    exit_code: 2
    stdout: 'Isolation mode: tempdir

      '
    stderr: 'contract-runner: --isolation-runtime cannot be used with --isolation
      tempdir

      '
  coverage_fingerprint: 060a6ea560fc34cca23d0f880fdd5b8e
- id: isolation-option-requires-value
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: missing isolation backend

      '
  coverage_fingerprint: cd3b46a14692a46d185cb64374054db4
- id: coverage-option-requires-path
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - none
    - --coverage-report
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: missing coverage report path

      '
  coverage_fingerprint: d2c741ba70f3209ab77c68e1522a65ab
- id: coverage-html-option-requires-directory
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - none
    - --coverage-html
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: missing HTML coverage directory

      '
  coverage_fingerprint: cdf4d65ff05c1036078859fd51f66cd6
- id: runtime-option-requires-path
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - landlock
    - --isolation-runtime
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: missing isolation runtime path

      '
  coverage_fingerprint: 6aa46ad737da728f2f8101e3a67bc5f1
