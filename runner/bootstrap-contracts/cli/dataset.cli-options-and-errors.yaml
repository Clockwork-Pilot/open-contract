version: 1
cases:
- id: empty-arguments-show-usage
  input:
    args: []
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: usage: contract-runner <run-manifest|show-isolation-plan>
      <manifest-path> [--isolation <auto|tempdir|none|bwrap|landlock>] [--isolation-runtime
      <path>] [--coverage-report <path>] [--disable-fingerprints|--update-fingerprints]
      [--no-nested-contracts]

      '
  coverage_fingerprint: 56c78783f7c7fdfad4f14495d8b51a2b
- id: unknown-subcommand-is-rejected
  input:
    args:
    - execute
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: usage: contract-runner <run-manifest|show-isolation-plan>
      <manifest-path> [--isolation <auto|tempdir|none|bwrap|landlock>] [--isolation-runtime
      <path>] [--coverage-report <path>] [--disable-fingerprints|--update-fingerprints]
      [--no-nested-contracts]

      '
  coverage_fingerprint: 56c78783f7c7fdfad4f14495d8b51a2b
- id: rejects-unknown-option
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - none
    - --unknown
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: unknown argument: --unknown

      '
  coverage_fingerprint: 24953803aec3273269b3bd8ea01ad249
- id: rejects-invalid-isolation-backend
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - invalid
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: invalid isolation backend "invalid"; expected auto,
      tempdir, none, bwrap, or landlock

      '
  coverage_fingerprint: daa467ca42628882bbdad1a5dc06cd44
- id: rejects-runtime-with-no-isolation
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - none
    - --isolation-runtime
    - runtime.yaml
  expected:
    exit_code: 2
    stdout: 'Isolation mode: none

      '
    stderr: 'contract-runner: --isolation-runtime cannot be used with --isolation
      none

      '
  coverage_fingerprint: cea66fb32d784ff9bbbb70ee685ab9ba
- id: rejects-runtime-with-tempdir
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - tempdir
    - --isolation-runtime
    - runtime.yaml
  expected:
    exit_code: 2
    stdout: 'Isolation mode: tempdir

      '
    stderr: 'contract-runner: --isolation-runtime cannot be used with --isolation
      tempdir

      '
  coverage_fingerprint: 43b32faac1e0557a387c561002a202da
- id: isolation-option-requires-value
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: missing isolation backend

      '
  coverage_fingerprint: 85c147aca2675015e35a59de886cc9eb
- id: coverage-option-requires-path
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - none
    - --coverage-report
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: missing coverage report path

      '
  coverage_fingerprint: 3ed7f015318e673b06657f6a6f539611
- id: runtime-option-requires-path
  input:
    args:
    - run-manifest
    - open-contract.yaml
    - --isolation
    - landlock
    - --isolation-runtime
  expected:
    exit_code: 2
    stdout: ''
    stderr: 'contract-runner: missing isolation runtime path

      '
  coverage_fingerprint: b4ec6ebd13ddb0f61d3d481e3b65e6e2
