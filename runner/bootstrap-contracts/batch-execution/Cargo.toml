[package]
name = "runner-batch"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "dataset-contract"
path = "src/main.rs"

[dependencies]
bootstrap-dataset-harness = { path = "../dataset-harness" }
runner-isolation = { path = "../isolation" }
runner-manifest = { path = "../manifest" }
runner-verification = { path = "../verification" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
