# Test fixture consumed by runner-manifest::ManifestPlan in the isolation
# dataset harness. This is not an Open Contract execution manifest.
version: "1"
name: isolation-bootstrap
coverage:
  minimum_line_percent: 100
files:
  dataset: dataset.json
  validator: src/lib.rs
  support:
    - src/lib.rs
    - src/backend.rs
    - Cargo.toml
filesystem:
  read:
    - dataset.json
    - src/lib.rs
    - src/backend.rs
    - Cargo.toml
    - support
  write:
    - reports
    - reports/result.json
    - reports/nested/result.json
