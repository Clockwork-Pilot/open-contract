# Test fixture consumed by runner-manifest::ManifestPlan in the isolation
# dataset harness. This is not an Open Contract execution manifest.
version: "1"
name: isolation-bootstrap
minimum_coverage_percent: 100
datasets: [dataset.json]
coverage_sources:
  - src/lib.rs
  - src/backend.rs
filesystem:
  read:
    - dataset.json
    - src/lib.rs
    - src/backend.rs
    - Cargo.toml
    - support
  write:
    - reports
    - reports/result.json
    - reports/nested/result.json
