version: 1
cases:
  - id: package-relative-path
    coverage_fingerprint: "f2e877f9967802943f49bdcaa566d3dd"
    input: {"operation": "path", "path": "validator.py"}
    expected: {"valid": true}
  - id: empty-path
    coverage_fingerprint: "50a13d9b16f89dd2bf94e1cc09b2bccc"
    input: {"operation": "path", "path": ""}
    expected: {"valid": false}
  - id: rejects-absolute-package-path
    coverage_fingerprint: "f267882d3776e31a0d757b4572f3630f"
    input: {"operation": "path", "path": "/outside/private.txt"}
    expected: {"valid": false}
  - id: backslash-path
    coverage_fingerprint: "f267882d3776e31a0d757b4572f3630f"
    input: {"operation": "path", "path": "folder\\\\file"}
    expected: {"valid": false}
  - id: parent-path
    coverage_fingerprint: "c5dfdbd5b912b48f7fd986f3b73a439f"
    input: {"operation": "path", "path": "../escape"}
    expected: {"valid": false}
  - id: empty-component
    coverage_fingerprint: "c2d010517afd96a608798300353982f7"
    input: {"operation": "path", "path": "folder//file"}
    expected: {"valid": false}
  - id: dot-component
    coverage_fingerprint: "c2d010517afd96a608798300353982f7"
    input: {"operation": "path", "path": "folder/./file"}
    expected: {"valid": false}
  - id: dot-path
    coverage_fingerprint: "c5dfdbd5b912b48f7fd986f3b73a439f"
    input: {"operation": "path", "path": "."}
    expected: {"valid": false}
  - id: drive-prefix
    coverage_fingerprint: "21ce135213fa43d1eecdd2d7a216ee93"
    input: {"operation": "path", "path": "C:/secret"}
    expected: {"valid": false}
  - id: valid-manifest-with-support-and-nested-contract
    coverage_fingerprint: "bca3a59f501245f017f91581e3b7e5e8"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py, support: [support/helper.py], nested_contracts: [child/contract.yaml]}
        filesystem: {read: [dataset.json, validator.py, support, child/contract.yaml], write: [reports/deep/result.json]}
    expected: {"valid": true}
  - id: invalid-line-coverage-threshold
    coverage_fingerprint: "e79b356a98553e330acf3f9a477ea0e0"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        coverage: {minimum_line_percent: 101}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: valid-manifest-with-explicit-supplemental-tests
    coverage_fingerprint: "4c73d15a7fa5fb8e4b3e5aeaa2275057"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py, supplemental_tests: [tests/extra.rs]}
        filesystem: {read: [dataset.json, validator.py, tests/extra.rs], write: []}
    expected: {"valid": true}
  - id: valid-manifest-with-execution-command
    coverage_fingerprint: "6248a12efdf3932bf07517b7ae4848c0"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        execution: {command: [python3, contract_entry.py]}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": true}
  - id: accepts-logical-language-package-reference
    coverage_fingerprint: "b7308020cceb1470d88eec3eb8a02979"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        language_package: python
        files: {dataset: dataset.json, validator: validator.py}
        execution: {command: [python3, contract_entry.py]}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": true}
  - id: rejects-empty-language-package-reference
    coverage_fingerprint: "df58c87c37f27d07c9cbeb88355c4141"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        language_package: '  '
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
