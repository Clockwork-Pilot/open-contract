    coverage_fingerprint: "f42526c6f7f53843afa19c5b5f9b445f"
    input: {"operation": "path", "path": "folder/./file"}
    expected: {"valid": false}
  - id: dot-path
    coverage_fingerprint: "7ccf59e1092f1d86369b4c94e52a3198"
    input: {"operation": "path", "path": "."}
    expected: {"valid": false}
