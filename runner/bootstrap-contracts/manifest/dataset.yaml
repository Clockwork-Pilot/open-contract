version: 1
cases:
  - id: allowlist-matches-exact-path
    coverage_fingerprint: "106777dfd55569f90f3252e5f14b9ffd"
    input: {"operation": "allowlist", "path": "data", "allowed": ["data"]}
    expected: {"valid": true}
  - id: allowlist-matches-child-path
    coverage_fingerprint: "c23a24305779bb53c5960c7bd131dbb8"
    input: {"operation": "allowlist", "path": "data/input.json", "allowed": ["data"]}
    expected: {"valid": true}
  - id: allowlist-rejects-sibling-prefix
    coverage_fingerprint: "c23a24305779bb53c5960c7bd131dbb8"
    input: {"operation": "allowlist", "path": "database/input.json", "allowed": ["data"]}
    expected: {"valid": false}
  - id: allowlist-rejects-unlisted-path
    coverage_fingerprint: "c23a24305779bb53c5960c7bd131dbb8"
    input: {"operation": "allowlist", "path": "elsewhere", "allowed": ["data"]}
    expected: {"valid": false}
  - id: package-relative-path
    coverage_fingerprint: "e561ded91a4fc200f7e1894519785b68"
    input: {"operation": "path", "path": "validator.py"}
    predicate: ".valid == true"
    expected: {"valid": true}
