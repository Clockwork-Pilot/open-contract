version: 1
cases:
  - id: package-relative-path
    coverage_fingerprint: "03ea2eb9a79fd0bf83742da054c2caa1"
    input: {"operation": "path", "path": "validator.py"}
    predicate: ".valid == true"
    expected: {"valid": true}
  - id: empty-path
    coverage_fingerprint: "c083d0bb843cf93fe3e31e617b27f9c0"
    input: {"operation": "path", "path": ""}
    expected: {"valid": false}
  - id: rejects-absolute-package-path
    coverage_fingerprint: "225e567890d45a71b88da3723b830a4a"
    input: {"operation": "path", "path": "/outside/private.txt"}
    expected: {"valid": false}
  - id: backslash-path
    coverage_fingerprint: "225e567890d45a71b88da3723b830a4a"
    input: {"operation": "path", "path": "folder\\\\file"}
    expected: {"valid": false}
  - id: parent-path
    coverage_fingerprint: "8df0660a2b7205c5de14363a4bac8c65"
    input: {"operation": "path", "path": "../escape"}
    expected: {"valid": false}
  - id: empty-component
    coverage_fingerprint: "7eab446b989833c119e6c928e3e5fb99"
    input: {"operation": "path", "path": "folder//file"}
    expected: {"valid": false}
  - id: dot-component
    coverage_fingerprint: "7eab446b989833c119e6c928e3e5fb99"
    input: {"operation": "path", "path": "folder/./file"}
    expected: {"valid": false}
  - id: dot-path
    coverage_fingerprint: "8df0660a2b7205c5de14363a4bac8c65"
    input: {"operation": "path", "path": "."}
    expected: {"valid": false}
  - id: drive-prefix
    coverage_fingerprint: "a812d588cd8a97eefc1600313b287cc9"
    input: {"operation": "path", "path": "C:/secret"}
    expected: {"valid": false}
  - id: valid-manifest-with-support-and-nested-contract
    coverage_fingerprint: "bc2c00a7f1476c370f63f1b31719091a"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py, support: [support/helper.py], nested_contracts: [child/contract.yaml]}
        filesystem: {read: [dataset.json, validator.py, support, child/contract.yaml], write: [reports/deep/result.json]}
    expected: {"valid": true}
  - id: invalid-line-coverage-threshold
    coverage_fingerprint: "948c27dced40b75d7558e00e1fdbfe07"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        coverage: {minimum_line_percent: 101}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: valid-manifest-with-explicit-supplemental-tests
    coverage_fingerprint: "f76044f7118e33bfb9c31b8ef2e9032a"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py, supplemental_tests: [tests/extra.rs]}
        filesystem: {read: [dataset.json, validator.py, tests/extra.rs], write: []}
    expected: {"valid": true}
  - id: valid-manifest-with-execution-command
    coverage_fingerprint: "fd54375b8e70697a7a0f9bce8bf0d2ba"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        execution: {command: [python3, contract_entry.py]}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": true}
  - id: accepts-logical-language-package-reference
    coverage_fingerprint: "e5c088c5b5088189037e05e2a9855213"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        language_package: python
        files: {dataset: dataset.json, validator: validator.py}
        execution: {command: [python3, contract_entry.py]}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": true}
  - id: rejects-empty-language-package-reference
    coverage_fingerprint: "6ab1e3b1b8e74332aa1b392d50c5d44b"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        language_package: '  '
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: rejects-path-as-language-package-reference
    coverage_fingerprint: "6ab1e3b1b8e74332aa1b392d50c5d44b"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        language_package: /opt/open-contract/languages/python
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: empty-execution-command
    coverage_fingerprint: "9ac2fd12a468f4629f6df28686211d99"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        execution: {command: []}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: blank-execution-command
    coverage_fingerprint: "9ac2fd12a468f4629f6df28686211d99"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        execution: {command: ['  ']}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: unsupported-manifest-version
    coverage_fingerprint: "cc55f476dcb2c0fc2ca4b7638653a058"
    input:
      operation: "manifest"
      yaml: |
        version: '2'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: blank-manifest-name
    coverage_fingerprint: "d6fd75b6d690993d3910967a8982bad3"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: '  '
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: missing-readable-path
    coverage_fingerprint: "992a6dd8c1a0957cb3d9935a76a00b63"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py, missing.json], write: []}
    expected: {"valid": false}
  - id: invalid-write-path
    coverage_fingerprint: "3d753aa7d9af3162e3cf8bda49aea9a6"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: [/tmp/out]}
    expected: {"valid": false}
  - id: undeclared-validator-read
    coverage_fingerprint: "4f510a488deeccf095e7efdf5cdacddb"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json], write: []}
    expected: {"valid": false}
  - id: missing-dataset-file
    coverage_fingerprint: "dbb0d85e75c8dd11f85c6d3f1e69b0db"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: missing.json, validator: validator.py}
        filesystem: {read: [missing.json, validator.py], write: []}
    expected: {"valid": false}
  - id: directory-is-not-a-manifest-file
    coverage_fingerprint: "34d4580f38c9de4d6332f897628dddcb"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: directory, validator: validator.py}
        filesystem: {read: [directory, validator.py], write: []}
    expected: {"valid": false}
  - id: malformed-manifest-yaml
    coverage_fingerprint: "5338d24420354685ce7fcf6552e1633a"
    input:
      operation: "manifest"
      yaml: |
        not: [valid: yaml
    expected: {"valid": false}
  - id: read-path-symlink-escape
    coverage_fingerprint: "64eb9608975169328e0579ed4c5c9128"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: escape, validator: validator.py}
        filesystem: {read: [escape, validator.py], write: []}
    expected: {"valid": false}
  - id: write-path-symlink-escape
    coverage_fingerprint: "ea3bbee4c3755e220bbf350a41b25bda"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: [escape/outside.txt]}
    expected: {"valid": false}
  - id: missing-manifest-path
    coverage_fingerprint: "3099c1519ba8b9c876bbbdc761410743"
    input: {"operation": "missing-manifest", "path": "missing-contract.yaml"}
    expected: {"valid": false}
  - id: directory-is-not-a-manifest
    coverage_fingerprint: "85839f4d77711f08e66f48680890f9d0"
    input: {"operation": "directory-manifest", "path": "."}
    expected: {"valid": false}
  - id: filesystem-root-is-not-a-manifest-package
    coverage_fingerprint: "85839f4d77711f08e66f48680890f9d0"
    input: {"operation": "root-manifest", "path": "/"}
    expected: {"valid": false}
  - id: filesystem-root-string-is-not-a-manifest-package
    coverage_fingerprint: "85839f4d77711f08e66f48680890f9d0"
    input: {"operation": "string-manifest", "path": "/"}
    expected: {"valid": false}
  - id: invalid-readable-package-path
    coverage_fingerprint: "e947cb5cbee85fe55e60660af0ac276b"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [../secret, dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: invalid-declared-file-path
    coverage_fingerprint: "e491f7a3601af928c59adc70e59b11f8"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: ../secret, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: rejects-package-name-with-separator
    coverage_fingerprint: "3eb879aa60cd5f8a55567daccbdf2fb8"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        language_package: node/package
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: declared-file-missing-outside-read-list
    coverage_fingerprint: "11d034fb08373a767f8e7175320cee26"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: missing.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: []}
    expected: {"valid": false}
  - id: write-path-dangling-symlink
    coverage_fingerprint: "d14f3d3cbe85e4f31728cfa1b3875ec9"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: [dangling/new-file]}
    expected: {"valid": false}
  - id: write-path-existing-directory
    coverage_fingerprint: "4f60dfb568fcffa8e8a9a7357083146b"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: [directory]}
    expected: {"valid": true}
  - id: write-path-inaccessible-ancestor
    coverage_fingerprint: "ea3bbee4c3755e220bbf350a41b25bda"
    setup: true
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: [blocked/new-file]}
    expected: {"valid": false}
  - id: write-path-parent-is-file
    coverage_fingerprint: "ea3bbee4c3755e220bbf350a41b25bda"
    input:
      operation: "manifest"
      yaml: |
        version: '1'
        name: sample
        files: {dataset: dataset.json, validator: validator.py}
        filesystem: {read: [dataset.json, validator.py], write: [dataset.json/child]}
    expected: {"valid": false}
