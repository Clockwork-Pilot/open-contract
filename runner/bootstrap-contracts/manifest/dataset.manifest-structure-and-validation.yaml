    operation: manifest
    yaml: "version: '1'\nname: sample\nfilesystem:\n  read:\n  - dataset.json\n  -\
      \ validator.py\n  - tests/extra.rs\n  write: []\ndatasets:\n- dataset.json\n\
      coverage_sources:\n- validator.py\nsupplemental_tests:\n- tests/extra.rs\n"
  expected:
    valid: true
