version: 1
cases:
- id: valid-manifest-with-support-and-nested-contract
  coverage_fingerprint: b083feff75d240618e9d95f3f89d0a2c
  input:
    operation: manifest
    yaml: "version: '1'\nname: sample\nfilesystem:\n  read:\n  - dataset.json\n  -\
      \ validator.py\n  - support\n  - child/contract.yaml\n  write:\n  - reports/deep/result.json\n\
      datasets:\n- dataset.json\ncoverage_sources:\n- validator.py\nnested_contracts:\n\
      - child/contract.yaml\n"
  expected:
    valid: true
- id: valid-manifest-with-explicit-supplemental-tests
  coverage_fingerprint: 4b286ea8b280e8bc1c289b0b650e46ee
