- id: nested-contract-sibling-manifest
  coverage_fingerprint: 38842ede780dffd33a401b03b16128b0
  setup: nested-contract-sibling-manifest
  input:
    operation: manifest
    yaml: "version: '1'\nname: parent\ndatasets: [dataset.json]\ncoverage_sources:\
      \ [validator.py]\nnested_contracts: [../sibling/contract.yaml]\nfilesystem:\n\
      \  read: [dataset.json, validator.py, ../sibling/contract.yaml]\n  write: []\n"
  expected:
    valid: true
