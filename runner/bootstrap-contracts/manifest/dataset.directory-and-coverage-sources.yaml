version: 1
cases:
- id: directory-aliases-and-coverage-globs-resolve
  coverage_fingerprint: 0058a6190bb6ea8606de4dbbfd516288
  input:
    operation: manifest
    yaml: "version: '1'\nname: aliased\ndirectories:\n  source: support\n  tests:\
      \ tests\n  child: child\n  output: output\ndatasets: ['@tests/data.json']\n\
      coverage_sources: ['@source/*.py', support/helper.py]\nnested_contracts: ['@child/contract.yaml']\n\
      supplemental_tests: ['@tests/extra.rs']\nfilesystem:\n  read: ['@tests', '@source',\
      \ '@child']\n  write: ['@output']\n"
  expected:
    valid: true
- id: directory-alias-rejects-invalid-name
  coverage_fingerprint: ec78f83bf3af065250b4b76cd567c911
  input:
    operation: manifest
    yaml: 'version: ''1''

      name: aliased

      directories: {''bad.name'': support}

      datasets: [dataset.json]

      coverage_sources: [validator.py]

      filesystem: {read: [dataset.json, validator.py], write: []}

      '
  expected:
    valid: false
- id: directory-alias-rejects-path-escape
  coverage_fingerprint: 9b2cd45b6a361cbc8e29ef3f9edff0ad
  input:
    operation: manifest
    yaml: 'version: ''1''

      name: aliased

      directories: {source: ../outside}

      datasets: [dataset.json]

      coverage_sources: [validator.py]

      filesystem: {read: [dataset.json, validator.py], write: []}

      '
  expected:
    valid: false
