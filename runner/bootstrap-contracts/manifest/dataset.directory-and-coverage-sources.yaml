      filesystem: {read: [''@tests'', validator.py], write: []}

      '
  expected:
    valid: false
- id: coverage-glob-must-match-a-file
  coverage_fingerprint: 41ba6b3d58ad095a9c048c0c3296cfdd
  input:
    operation: manifest
    yaml: 'version: ''1''

      name: glob

