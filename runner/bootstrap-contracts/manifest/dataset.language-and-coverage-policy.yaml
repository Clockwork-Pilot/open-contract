version: 1
cases:
- id: invalid-line-coverage-threshold
  coverage_fingerprint: cdbd9ee497fa93cd52c921793c6ea61a
  input:
    operation: manifest
    yaml: "version: '1'\nname: sample\nminimum_coverage_percent: 101\nfilesystem:\n\
      \  read:\n  - dataset.json\n  - validator.py\n  write: []\ndatasets:\n- dataset.json\n\
      coverage_sources:\n- validator.py\n"
  expected:
    valid: false
- id: accepts-contract-with-explicit-public-source
  coverage_fingerprint: afea99575b712d8c55af36c47392d61a
  input:
    operation: manifest
    yaml: "version: '1'\nname: sample\nexecution:\n  command:\n  - python3\n  - contract_entry.py\n\
      filesystem:\n  read:\n  - dataset.json\n  - validator.py\n  write: []\ndatasets:\n\
      - dataset.json\ncoverage_sources:\n- validator.py\n"
  expected:
    valid: true
