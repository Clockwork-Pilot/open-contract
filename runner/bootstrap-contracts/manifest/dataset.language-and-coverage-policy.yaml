  input:
    operation: manifest
    yaml: 'version: ''1''

      name: adapter

      datasets: [dataset.json]

      coverage_sources: [validator.py]

      language_adapter: ../adapter-runtime.yaml

      filesystem: {read: [dataset.json, validator.py], write: []}

      '
  expected:
    valid: true
