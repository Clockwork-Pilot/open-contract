version: 1
cases:
- id: manifest-dataset-entry-has-value-schema-paths
  coverage_fingerprint: a491e96f7978132037e5b1a3097645a6
  input:
    operation: manifest
    yaml: "version: '1'\nname: schema-manifest\ndatasets:\n  - path: dataset.json\n\
      \    schema: schemas/values.yaml\ncoverage_sources: [validator.py]\nfilesystem:\n\
      \  read: [dataset.json, validator.py, schemas/values.yaml]\n  write: []\n"
  expected:
    valid: true
