[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-contracts-predicates"
version = "1.0.0"
description = "Python evaluator for the Open Contracts bootstrap predicate dataset"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
