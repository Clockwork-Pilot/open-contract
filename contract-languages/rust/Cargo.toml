[package]
name = "open-contract-language-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust batch adapter for Open Contract validators"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
