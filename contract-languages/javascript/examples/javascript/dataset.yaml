version: 1
targets:
  - id: example
    kind: command
    config:
      command: [node, examples/javascript/evaluator.mjs]
    cases:
      - id: double-exact
        input: { operation: double, value: 3 }
        expected: { value: 6, requests: 1 }
        coverage_fingerprint: f7fde4711eaeb8d16717d4002cf2b12b
      - id: negate-exact
        input: { operation: negate, value: 4 }
        expected: { value: -4, requests: 1 }
        coverage_fingerprint: f7fde4711eaeb8d16717d4002cf2b12b
      - id: double-predicate
        input: { operation: double, value: 5 }
        predicate: '.value == 10 AND .requests == 1'
        coverage_fingerprint: f7fde4711eaeb8d16717d4002cf2b12b
      - id: fallback-predicate
        input: { operation: other, value: 1 }
        predicate: '.error == "unsupported operation" AND .requests == 1'
        coverage_fingerprint: f7fde4711eaeb8d16717d4002cf2b12b
