[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-contract-isolation"
version = "1.0.0"
description = "Language-neutral Python isolation CLI for Open Contracts"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
open-contract = "open_contract:main"

[tool.setuptools]
py-modules = ["open_contract"]

[tool.setuptools.package-dir]
"" = "bin"
