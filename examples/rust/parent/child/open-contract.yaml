version: "1"
name: rust-child-example
coverage:
  minimum_line_percent: 100
datasets: [dataset.yaml]
coverage_sources: [src/implementation.rs]
execution:
  command:
    - env
    - TMPDIR=.open-contract-work
    - LLVM_PROFILE_FILE=.open-contract-work/%m-%p.profraw
    - LLVM_PROFDATA=.deps/bin/llvm-profdata
    - LLVM_COV=.deps/bin/llvm-cov
    - LD_LIBRARY_PATH=.deps/lib
    - ./contract-command
language_adapter: ../../../../contract-languages/rust/runtime.yaml
filesystem:
  read:
    - dataset.yaml
    - src/main.rs
    - src/validator.rs
    - src/implementation.rs
    - contract-command
    - .deps
    - .open-contract-work
  write:
    - .open-contract-work
