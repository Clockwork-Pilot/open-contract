version: "1"
name: rust-parent-example
language_package: rust
coverage:
  minimum_line_percent: 100
files:
  dataset: dataset.yaml
  validator: src/validator.rs
  support:
    - src/implementation.rs
  nested_contracts:
    - child/contract.yaml
execution:
  command:
    - env
    - TMPDIR=.open-contract-work
    - LLVM_PROFILE_FILE=.open-contract-work/%m-%p.profraw
    - ./contract-command
filesystem:
  read:
    - dataset.yaml
    - src/main.rs
    - src/validator.rs
    - src/implementation.rs
    - contract-command
    - child/contract.yaml
    - .open-contract-work
  write:
    - .open-contract-work
